<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
<title id="title">The operational problems LaundroMart is designed to address</title>
<desc id="desc">A dark navy laundry operations scene showing a frustrated customer, a missing garment, an unclear order record and delayed status updates.</desc>
