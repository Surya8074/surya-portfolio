<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 650" role="img" aria-labelledby="title desc">
<title id="title">ComSki communication practice interface</title><desc id="desc">A layered interface showing speaking, writing, listening and reading, a person practising communication, AI feedback and a suggested next practice.</desc>
<defs>
 <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f5ff"/><stop offset=".55" stop-color="#eef5ff"/><stop offset="1" stop-color="#f9eafa"/></linearGradient>
 <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fdfdff"/><stop offset="1" stop-color="#dfeaff"/></linearGradient>
 <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8b18c"/><stop offset="1" stop-color="#b96f51"/></linearGradient>
 <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9bb8ee"/><stop offset="1" stop-color="#d4e2ff"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#536a9c" flood-opacity=".16"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
<ellipse cx="474" cy="325" rx="370" ry="278" fill="#dce8ff" opacity=".55" filter="url(#soft)"/>
<circle cx="570" cy="325" r="265" fill="none" stroke="#b8adff" stroke-width="2" opacity=".7"/><circle cx="570" cy="325" r="214" fill="none" stroke="#d8dfff" stroke-width="1.5"/>
<circle cx="766" cy="94" r="63" fill="#eee5ff" opacity=".8"/><circle cx="150" cy="500" r="84" fill="#e4efff" opacity=".8"/>
