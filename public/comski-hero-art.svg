<g transform="translate(563 445) rotate(-2 155 69)" filter="url(#shadow)"><rect width="294" height="132" rx="24" fill="#fff" stroke="#e6eaf4"/><rect x="18" y="22" width="39" height="39" rx="13" fill="#f0eaff"/><path d="M29 31h15v20H29zM33 36h8m-8 5h8m-8 5h5" fill="none" stroke="#8a67dc" stroke-width="2" stroke-linecap="round"/><text x="71" y="33" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1" fill="#8a96ad">YOUR NEXT PRACTICE</text><text x="71" y="56" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#202842">Introduce yourself</text><text x="71" y="76" font-family="Arial,sans-serif" font-size="11" fill="#71809a">Prepare for your next team meeting.</text><circle cx="259" cy="100" r="17" fill="#edf2ff"/><path d="M251 100h15m-6-6 6 6-6 6" fill="none" stroke="#4d6fe2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
