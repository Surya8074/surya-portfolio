 <path d="M97 218c-2-50 25-77 59-75 38 1 59 27 56 71-14-8-26-20-35-35-17 18-42 29-80 31z" fill="#34252b"/>
 <path d="M105 236c2 28 18 50 42 51 27 1 43-22 45-48-9 10-18 13-27 13-18 0-30-11-38-22-7 4-14 6-22 6z" fill="#cf8b69" opacity=".65"/>
 <ellipse cx="131" cy="227" rx="4" ry="5" fill="#362b31"/><ellipse cx="169" cy="227" rx="4" ry="5" fill="#362b31"/><path d="M139 251q12 10 23-1" fill="none" stroke="#8c4d43" stroke-width="3" stroke-linecap="round"/>
 <path d="M113 204q10-8 21-2m21 0q12-7 23 2" fill="none" stroke="#51333a" stroke-width="3" stroke-linecap="round"/>
 <path d="M79 369q-14 9-17 35m135-32q18 8 24 29" fill="none" stroke="#f3c9b0" stroke-width="17" stroke-linecap="round"/>
 <rect x="25" y="423" width="252" height="45" rx="16" fill="#fff" opacity=".94"/><path d="M88 445h4v5h-4zm10-8h4v13h-4zm10-5h4v18h-4zm10 9h4v9h-4zm10-13h4v22h-4zm10 5h4v17h-4zm10 3h4v14h-4zm10-8h4v22h-4zm10 8h4v14h-4zm10-3h4v17h-4zm10 6h4v11h-4z" fill="#7b9cff"/>
</g>
<!-- feedback panel -->
<g transform="translate(588 151) rotate(3 140 125)" filter="url(#shadow)">
 <rect width="267" height="242" rx="25" fill="#fff" stroke="#e6eaf4"/>
 <text x="22" y="34" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#202842">AI Feedback</text><text x="22" y="52" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1" fill="#8961e9">PERSONALISED INSIGHTS</text>
 <circle cx="60" cy="111" r="35" fill="none" stroke="#e7edfb" stroke-width="10"/><circle cx="60" cy="111" r="35" fill="none" stroke="#4d82f4" stroke-width="10" stroke-dasharray="172 220" stroke-linecap="round" transform="rotate(-90 60 111)"/><text x="60" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#263553">78%</text>
 <g font-family="Arial,sans-serif" font-size="10" fill="#65728c"><text x="118" y="88">Clarity</text><text x="118" y="119">Confidence</text><text x="118" y="150">Engagement</text><text x="118" y="181">Pace</text><text x="118" y="212">Structure</text></g>
 <g><rect x="179" y="80" width="66" height="6" rx="3" fill="#edf0f8"/><rect x="179" y="80" width="48" height="6" rx="3" fill="#4fc7a0"/><rect x="179" y="111" width="66" height="6" rx="3" fill="#edf0f8"/><rect x="179" y="111" width="44" height="6" rx="3" fill="#4d8ef7"/><rect x="179" y="142" width="66" height="6" rx="3" fill="#edf0f8"/><rect x="179" y="142" width="51" height="6" rx="3" fill="#ff917f"/><rect x="179" y="173" width="66" height="6" rx="3" fill="#edf0f8"/><rect x="179" y="173" width="37" height="6" rx="3" fill="#a27cf3"/><rect x="179" y="204" width="66" height="6" rx="3" fill="#edf0f8"/><rect x="179" y="204" width="42" height="6" rx="3" fill="#8d9cf5"/></g>
</g>
<!-- feedback bubble -->
<g transform="translate(69 423) rotate(-4)" filter="url(#shadow)"><rect width="247" height="93" rx="20" fill="#fff" stroke="#e8edf7"/><circle cx="31" cy="32" r="14" fill="#e9efff"/><path d="m31 21 3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#4777e6"/><text x="54" y="29" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#27334f">Great structure!</text><text x="54" y="50" font-family="Arial,sans-serif" font-size="12" fill="#66738d">Try to slow down a bit</text><text x="54" y="67" font-family="Arial,sans-serif" font-size="12" fill="#66738d">for better clarity.</text></g>
