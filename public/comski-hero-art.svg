 <rect width="225" height="290" rx="26" fill="#fff" stroke="#e7ebf5"/>
 <text x="23" y="34" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#202842">Choose a skill</text><text x="191" y="34" font-family="Arial,sans-serif" font-size="19" fill="#6079de">↗</text>
 <g font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#27334f">
  <rect x="15" y="52" width="195" height="48" rx="15" fill="#f3f6ff"/><circle cx="40" cy="76" r="14" fill="#deebff"/><path d="M35 76h10m-5-5v10" stroke="#3677dc" stroke-width="2" stroke-linecap="round"/><text x="64" y="81">Speaking</text><text x="190" y="81" fill="#9aa6be" font-size="22">›</text>
  <rect x="15" y="108" width="195" height="48" rx="15" fill="#fff8f6"/><circle cx="40" cy="132" r="14" fill="#ffe6df"/><path d="m35 136 2-7 8-4 2 2-4 8-8 3z" fill="none" stroke="#df7a67" stroke-width="2"/><text x="64" y="137">Writing</text><text x="190" y="137" fill="#9aa6be" font-size="22">›</text>
  <rect x="15" y="164" width="195" height="48" rx="15" fill="#f2fbf8"/><circle cx="40" cy="188" r="14" fill="#d9f5eb"/><path d="M33 188v-4a7 7 0 0 1 14 0v4m-14-1h-3v6h5v-5m12-1h3v6h-5v-5" fill="none" stroke="#1e9e7b" stroke-width="2"/><text x="64" y="193">Listening</text><text x="190" y="193" fill="#9aa6be" font-size="22">›</text>
  <rect x="15" y="220" width="195" height="48" rx="15" fill="#f8f4ff"/><circle cx="40" cy="244" r="14" fill="#eee3ff"/><path d="M34 237h5a5 5 0 0 1 5 5v9h-5a5 5 0 0 0-5-2zM46 237h-2v14h2a5 5 0 0 1 5-2v-12z" fill="none" stroke="#8a63d8" stroke-width="1.8"/><text x="64" y="249">Reading</text><text x="190" y="249" fill="#9aa6be" font-size="22">›</text>
 </g>
</g>
<!-- central practice phone -->
